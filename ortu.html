<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIAKAD Sekolah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- CSS Variable & Style Dinamis -->
  <style>
    :root {
      --primary-color: #2563eb; /* Warna Default: Blue */
      --primary-hover: #1d4ed8;
    }
    .bg-theme { background-color: var(--primary-color) !important; }
    .bg-theme-hover:hover { background-color: var(--primary-hover) !important; }
    .text-theme { color: var(--primary-color) !important; }
    .border-theme { border-color: var(--primary-color) !important; }
  </style>

  <script>
    // Load Warna Tema dari LocalStorage atau Supabase secara otomatis
    const savedColor = localStorage.getItem('theme_color') || '#2563eb';
    const savedHover = localStorage.getItem('theme_hover') || '#1d4ed8';
    document.documentElement.style.setProperty('--primary-color', savedColor);
    document.documentElement.style.setProperty('--primary-hover', savedHover);
  </script>
</head>
<body class="bg-slate-100 min-h-screen font-sans pb-10">

  <!-- Top App Bar (Mobile View) -->
  <div class="bg-blue-600 text-white p-5 rounded-b-3xl shadow-md sticky top-0 z-10">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div>
        <p class="text-blue-200 text-xs font-semibold uppercase tracking-wider">Portal Wali Murid</p>
        <h1 id="studentNameDisplay" class="text-xl font-extrabold mt-0.5">Memuat Nama Anak...</h1>
      </div>
      <a href="index.html" class="bg-white/20 hover:bg-white/30 text-white text-xs px-3 py-1.5 rounded-xl transition font-medium">
        🏠 Home
      </a>
    </div>
  </div>

  <div class="max-w-md mx-auto p-4 space-y-4 mt-2">

    <!-- Card Poin & Summary -->
    <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 flex items-center justify-between">
      <div>
        <p class="text-xs font-bold text-slate-400 uppercase tracking-wider">Sisa Poin Karakter</p>
        <div class="flex items-baseline gap-1 mt-1">
          <span id="studentPoints" class="text-3xl font-extrabold text-blue-600">100</span>
          <span class="text-xs text-slate-400 font-semibold">/ 100 Poin</span>
        </div>
      </div>
      <div class="w-12 h-12 bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center text-2xl">
        🛡️
      </div>
    </div>

    <!-- Feed Catatan Kedisiplinan -->
    <div class="space-y-3">
      <h2 class="font-bold text-slate-800 text-sm flex items-center justify-between">
        <span>📜 Catatan & Penanganan Kedisiplinan</span>
        <button onclick="fetchChildReports()" class="text-blue-600 text-xs font-semibold">🔄 Refresh</button>
      </h2>

      <div id="reportsTimeline" class="space-y-3">
        <div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400 shadow-sm border border-slate-200">
          Memuat catatan kedisiplinan anak...
        </div>
      </div>
    </div>

  </div>

  <script>
    // ⚙️ SUPABASE CONFIG (TERHUBUNG KE DATABASE LU)
    const SUPABASE_URL = 'https://xjnhknntbytizgecqdox.supabase.co';[cite: 2]
    const SUPABASE_KEY = 'sb_publishable_yUR2kIFIsUZ0g7RUomempg_gmP3z8xT'; // Ganti dengan Publishable Key lengkap milikmu[cite: 1]
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const studentNameDisplay = document.getElementById('studentNameDisplay');
    const studentPoints = document.getElementById('studentPoints');
    const reportsTimeline = document.getElementById('reportsTimeline');

    // Ambil data siswa & catatan kedisiplinan
    async function fetchChildReports() {
      // 1. Ambil data siswa pertama dari database (Untuk simulasi/testing tampilan ortu)
      const { data: students, error: studentErr } = await supabaseClient
        .from('students')
        .select('id, full_name, base_discipline_points')
        .limit(1)
        .single();

      if (studentErr || !students) {
        studentNameDisplay.innerText = "Anak Tidak Ditemukan";
        reportsTimeline.innerHTML = '<div class="bg-white p-6 rounded-2xl text-center text-xs text-slate-400 border border-slate-200">Belum ada data siswa di database.</div>';
        return;
      }

      studentNameDisplay.innerText = students.full_name;
      studentPoints.innerText = students.base_discipline_points || 100;

      // 2. Ambil riwayat laporan pelanggaran anak tersebut
      const { data: reports, error: reportsErr } = await supabaseClient
        .from('discipline_reports')
        .select('*')
        .eq('student_id', students.id)
        .order('created_at', { ascending: false });

      if (reportsErr) {
        reportsTimeline.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-xs text-rose-500 font-medium">Gagal memuat catatan: ${reportsErr.message}</div>`;
        return;
      }

      if (!reports || reports.length === 0) {
        reportsTimeline.innerHTML = `
          <div class="bg-white p-6 rounded-2xl text-center shadow-sm border border-slate-200 space-y-2">
            <div class="text-3xl">🌟</div>
            <p class="text-xs font-bold text-slate-700">Alhamdulillah!</p>
            <p class="text-[11px] text-slate-400">Anak Anda belum memiliki catatan pelanggaran kedisiplinan.</p>
          </div>
        `;
        return;
      }

      reportsTimeline.innerHTML = '';
      reports.forEach(r => {
        const dateStr = new Date(r.created_at).toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
        
        let statusBadge = '<span class="bg-amber-100 text-amber-800 text-[10px] font-bold px-2.5 py-1 rounded-full">Proses Penanganan Wali Kelas</span>';
        if (r.status === 'closed') {
          statusBadge = '<span class="bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2.5 py-1 rounded-full">🟢 Selesai / Teratasi</span>';
        } else if (r.status === 'escalated_kesiswaan') {
          statusBadge = '<span class="bg-rose-100 text-rose-800 text-[10px] font-bold px-2.5 py-1 rounded-full">🚨 Pembinaan Kesiswaan / BK</span>';
        }

        const followUpSection = r.follow_up_action ? `
          <div class="mt-3 pt-3 border-t border-slate-100">
            <p class="text-[11px] font-bold text-slate-700">Tindak Lanjut & Pembinaan Wali Kelas:</p>
            <p class="text-xs text-slate-600 mt-0.5">${r.follow_up_action}</p>
          </div>
        ` : '';

        reportsTimeline.innerHTML += `
          <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-semibold text-slate-400">${dateStr}</span>
              ${statusBadge}
            </div>

            <div>
              <p class="text-xs font-bold text-slate-800">Kronologi Kejadian:</p>
              <p class="text-xs text-slate-600 mt-0.5">${r.chronology}</p>
            </div>

            <div>
              <p class="text-xs font-bold text-slate-800">Tindakan Awal Guru:</p>
              <p class="text-xs text-slate-600 mt-0.5">${r.initial_action}</p>
            </div>

            ${followUpSection}
          </div>
        `;
      });
    }

    // Jalankan fetch data saat halaman dibuka
    fetchChildReports();
  </script>
</body>
</html>
